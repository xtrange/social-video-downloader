<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDX.cl — Bajar Videos de Instagram, TikTok, Facebook y X Gratis</title>
  <meta name="description" content="Descarga directa de videos y Reels desde Instagram, TikTok (sin marca de agua), Facebook, X, Pinterest, Threads, LinkedIn y más con solo pegar el link." />
  <link rel="canonical" href="https://ddx.cl/" />
  <meta property="og:title" content="DDX.cl — Descarga Directa de Videos" />
  <meta property="og:description" content="Pega el enlace del post y descarga videos de Instagram, TikTok, Facebook, X y más sin publicidad." />
  <meta property="og:url" content="https://ddx.cl/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_CL" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ddx_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/index.css?v=5.0" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "DDX.cl",
    "alternateName": "DDX Descarga Directa",
    "url": "https://ddx.cl/",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "All",
    "inLanguage": "es_CL",
    "description": "Herramienta web gratuita en Chile para bajar videos y Reels de Instagram, TikTok sin marca de agua, Facebook, X, Pinterest, Threads, LinkedIn y Reddit con solo pegar el enlace.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "CLP"
    }
  }
  </script>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Descargador de video DDX">
      <header class="card-header">
        <div class="brand-row">
          <div class="brand-left">
            <span class="brand-badge">ddx.cl</span>
            <h1>Descargar video</h1>
          </div>
          <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar modo oscuro / claro" aria-label="Cambiar modo oscuro o claro">
            <span id="theme-icon" aria-hidden="true">☾</span>
          </button>
        </div>
        <p>Pega el enlace del post. Identificaremos la fuente y las opciones de descarga automáticamente.</p>
      </header>

      <form id="dl-form" class="input-bar" novalidate>
        <div class="input-field-wrap">
          <input
            type="url"
            id="url-input"
            class="url-input"
            placeholder="https://..."
            autocomplete="off"
            spellcheck="false"
            required
          />
          <div class="inline-actions">
            <button type="button" id="paste-btn" class="ghost-btn">Pegar</button>
            <button type="button" id="clear-btn" class="ghost-btn hidden">Borrar</button>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="primary-btn">Continuar</button>
      </form>

      <div id="feedback-box" class="feedback hidden" role="status"></div>

      <div id="loading-box" class="loading hidden" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Identificando fuente y formatos disponibles...</span>
      </div>

      <div id="result-box" class="result hidden" aria-live="polite">
        <!-- Mejora 8: Selector de videos en publicaciones de tipo Carrusel (2 o más videos) -->
        <div id="carousel-tabs" class="carousel-tabs hidden" role="tablist" aria-label="Videos en esta publicación"></div>

        <!-- Resumen del video con screenshot interactivo (mini-player), descarga de portada y descripción expandible -->
        <div class="media-summary">
          <div class="thumb-wrap" id="thumb-wrap" title="Haz clic para reproducir vista previa">
            <img id="video-thumb" class="video-thumb hidden" alt="Vista previa del video" referrerpolicy="no-referrer" />
            <video id="video-preview-player" class="video-preview-player hidden" controls playsinline preload="metadata"></video>
            <div id="thumb-placeholder" class="thumb-placeholder" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </div>
            <div id="thumb-play-overlay" class="thumb-play-overlay hidden" aria-hidden="true">
              <span class="play-circle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
              </span>
            </div>
            <span id="video-duration" class="video-duration"></span>
          </div>

          <div class="media-info">
            <div class="result-header">
              <div class="result-meta">
                <span id="source-badge" class="source-badge">Fuente</span>
                <span id="video-uploader" class="video-uploader"></span>
              </div>
              <div class="result-actions-right">
                <button type="button" id="dl-thumb-btn" class="copy-desc-btn hidden" title="Descargar imagen de portada">Portada</button>
                <button type="button" id="copy-desc-btn" class="copy-desc-btn hidden" title="Copiar descripción del video">Copiar texto</button>
              </div>
            </div>
            <p id="video-title" class="video-description"></p>
            <button type="button" id="toggle-desc-btn" class="toggle-desc-btn hidden">Ver más</button>
          </div>
        </div>

        <!-- Bloque 1: Videos de menor a mayor resolución -->
        <div class="options-block">
          <div class="block-title">1. Video (de menor a mayor resolución)</div>
          <div id="video-options-list" class="options-list"></div>
        </div>

        <!-- Bloque 2: Descarga de solo audio -->
        <div class="options-block">
          <div class="block-title">2. Solo audio</div>
          <div id="audio-options-list" class="options-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js?v=5.0"></script>
</body>
</html>
